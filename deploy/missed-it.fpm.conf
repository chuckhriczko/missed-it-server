[missed-it]
user = chuck
group = chuck
listen = /run/php/missed-it.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500
chdir = /var/www/sites/missed-it/server
clear_env = yes
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[upload_max_filesize] = 100K
php_admin_value[post_max_size] = 256K
php_admin_value[memory_limit] = 128M
